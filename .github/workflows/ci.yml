name: CI Checks

on:
  pull_request:
    branches:
      - gh-pages
      - main
  push:
    branches:
      - gh-pages
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ matrix.node-version == '24.x' && '0' || '1' }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run test:lint

      - name: Build code
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Assemble classic and vector demos
        if: matrix.node-version == '24.x'
        run: npm run assemble:demo-site

  docker-build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -f docker/Dockerfile .
