<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Open Source Routing Machine DEMO</title>
    <meta name='viewport' content='initial-scale=1.0 maximum-scale=1.0'>
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel='stylesheet' href="css/leaflet.css" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link href='css/site.css' rel='stylesheet' />

  </head>
  <body>
    <div id='map' class='map'></div>
    <script>
      // Load runtime configuration (generated by Docker entrypoint from OSRM_* env vars)
      // Falls back to bundled defaults if config.json is not available
      window.osrmConfig = {
        OSRM_BACKEND: 'https://router.project-osrm.org',
        OSRM_CENTER: '38.8995,-77.0269',
        OSRM_ZOOM: 13,
        OSRM_LANGUAGE: 'en',
        OSRM_LABEL: 'Car (fastest)',
        OSRM_DEFAULT_LAYER: 'streets'
      };

      (function() {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', 'config.json', false);
        xhr.onload = function() {
          if (xhr.status === 200) {
            try {
              window.osrmConfig = JSON.parse(xhr.responseText);
            } catch (e) {
              console.warn('Failed to parse config.json:', e);
            }
          }
        };
        xhr.onerror = function() {
          console.warn('config.json not found, using defaults');
        };
        xhr.send();
      })();
    </script>
    <script src='bundle.js'></script>
  </body>
</html>
